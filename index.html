<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excisa</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<meta name="theme-color" content="#141b2d">

<style>
  :root { --bg:#ffffff; --fg:#141b2d; --muted:#5a6478; --accent:#3d6fd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141b2d; --fg:#eef1f7; --muted:#9aa4b8; --accent:#5b8cf0; } }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; justify-content:center;
    max-width:40rem; margin:0 auto; padding:0 16px; box-sizing:border-box; }
  h1 { margin:0 0 1.25rem; }
  h1 img { display:block; height:clamp(48px,12vw,80px); width:auto; }
  p { font-size:1.15rem; line-height:1.5; color:var(--muted); margin:.25rem 0; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1><picture>
    <source srcset="img/excisa-dark.svg" media="(prefers-color-scheme: dark)">
    <img src="img/excisa-light.svg" alt="Excisa">
  </picture></h1>
  <p>Self-hosted PDF redaction that proves the text is gone.</p>
  <p>Coming soon. <a href="mailto:hello@excisa.com">hello@excisa.com</a></p>
